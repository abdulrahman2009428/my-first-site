!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>موقعي الجديد</title>

    body {

      font-family: Arial, sans-serif;

    }
    h1 {

      color: #333;
    }
    p {
      font-size: 22px;
      color: #555;
    }

      padding: 12px 25px;

      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>أهلاً بك في موقعي!!</h1>
  <p>.أنا بتعلم برمجة وببني موقعي بنفسي</p>
  <button onclick="calculate()">احسب الخصم</button>
<script>
  function calculate() {
    alert("أهلاً بك! الحساب شغال تمام وفي الخطوة الجاية هنخليه يحسب الخصم!");
  }
</script>
</body>
</html>
