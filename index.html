<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- السطر ده هو اللي بيكبر الكلام ويخليه متناسق مع شاشة الموبايل -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة الخصم</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px 15px;
      background-color: #f4f6f9;
    }
    .calculator-card {
      max-width: 400px;
      margin: 20px auto;
      background: white;
      padding: 25px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 26px;
      color: #333;
      margin-bottom: 20px;
    }
    input {
      padding: 14px;
      font-size: 18px;
      margin: 10px 0;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      text-align: center;
    }
    button {
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }
    h2 {
      color: #28a745;
      margin-top: 25px;
      font-size: 22px;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <h1>حاسبة الخصم للمحلات 🏷️</h1>
    
    <input type="number" id="price" placeholder="أدخل السعر (مثلاً 1000)">
    <input type="number" id="discount" placeholder="نسبة الخصم % (مثلاً 50)">
    
    <button onclick="calculateDiscount()">احسب السعر النهائي</button>

    <h2 id="result"></h2>
  </div>

  <script>
    function calculateDiscount() {
      let price = document.getElementById("price").value;
      let discount = document.getElementById("discount").value;

      if (price === "" || discount === "") {
        alert("من فضلك أدخل السعر ونسبة الخصم أولاً!");
        return;
      }

      let discountAmount = (price * discount) / 100;
      let finalPrice = price - discountAmount;

      document.getElementById("result").innerText = "السعر بعد الخصم: " + finalPrice + " جنيه";
    }
  </script>

</body>
</html>
