<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>حاسبة الخصومات</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    input {
      padding: 10px;
      font-size: 18px;
      margin: 10px;
      width: 200px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 12px 25px;
      font-size: 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    h2 {
      color: #28a745;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>حاسبة الخصم للمحلات 🏷️</h1>
  
  <input type="number" id="price" placeholder="أدخل السعر (مثلاً 200)">
  <br>
  <input type="number" id="discount" placeholder="نسبة الخصم % (مثلاً 10)">
  <br>
  <button onclick="calculateDiscount()">احسب السعر النهائي</button>

  <h2 id="result"></h2>

  <script>
    function calculateDiscount() {
      let price = document.getElementById("price").value;
      let discount = document.getElementById("discount").value;

      if (price === "" || discount === "") {
        alert("من فضلك أدخل السعر ونسبة الخصم أولاً!");
        return;
      }

      let discountAmount = (price * discount) / 100;
      let finalPrice = price - discountAmount;

      document.getElementById("result").innerText = "السعر بعد الخصم: " + finalPrice + " جنيه";
    }
  </script>

</body>
</html>
